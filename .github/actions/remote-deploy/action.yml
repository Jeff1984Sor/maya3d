name: Deploy remoto no prod2
description: Envia infra/ e ops/ por SSH, executa ops/deploy.sh e os smoke tests.

inputs:
  stack: { description: staging ou prod, required: true }
  image-tag: { description: tag das imagens no registro, required: true }
  ssh-host: { required: true }
  ssh-user: { required: true }
  ssh-key: { required: true }
  ssh-known-hosts: { required: true }

runs:
  using: composite
  steps:
    - name: Preparar SSH
      shell: bash
      run: |
        install -m 700 -d ~/.ssh
        printf '%s\n' "${{ inputs.ssh-key }}" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
        printf '%s\n' "${{ inputs.ssh-known-hosts }}" > ~/.ssh/known_hosts

    - name: Enviar infra/ e ops/
      shell: bash
      run: |
        tar czf bundle.tgz infra ops
        SSH="ssh -i ~/.ssh/deploy_key ${{ inputs.ssh-user }}@${{ inputs.ssh-host }}"
        scp -i ~/.ssh/deploy_key bundle.tgz "${{ inputs.ssh-user }}@${{ inputs.ssh-host }}:/tmp/print3d-bundle.tgz"
        $SSH 'tar xzf /tmp/print3d-bundle.tgz -C /srv/print3d && rm /tmp/print3d-bundle.tgz'

    - name: Deploy
      shell: bash
      run: |
        ssh -i ~/.ssh/deploy_key ${{ inputs.ssh-user }}@${{ inputs.ssh-host }} \
          "CONFIRM_PROD=yes bash /srv/print3d/ops/deploy.sh ${{ inputs.stack }} ${{ inputs.image-tag }}"

    - name: Smoke tests
      shell: bash
      run: |
        ssh -i ~/.ssh/deploy_key ${{ inputs.ssh-user }}@${{ inputs.ssh-host }} \
          "bash /srv/print3d/ops/smoke.sh ${{ inputs.stack }}"
