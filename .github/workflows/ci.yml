name: CI

on:
  pull_request:
  workflow_call: # reaproveitado pelo cd.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guards:
    name: Guardas (marca, shell, compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Marca não pode estar fixa no código
        run: python tools/check_brand.py
      - name: ShellCheck (ops)
        run: shellcheck ops/*.sh ops/lib/*.sh
      - name: Compose válido (staging e prod)
        run: |
          for stack in staging prod; do
            STACK_ENV_FILE=/dev/null REGISTRY=ghcr.io/ci IMAGE_TAG=ci \
            docker compose --env-file infra/compose/env/$stack.env \
              -f infra/compose/docker-compose.yml config --quiet
          done

  backend:
    name: Backend (ruff, mypy, pytest, migrações)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: print3d
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/print3d
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - name: Dependências
        run: uv sync --all-packages --group dev ${{ hashFiles('uv.lock') != '' && '--locked' || '' }}
      - name: Publicar uv.lock gerado (commitar na primeira vez)
        if: hashFiles('uv.lock') == ''
        uses: actions/upload-artifact@v4
        with: { name: uv-lock, path: uv.lock }
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (formato)
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy apps/api/src apps/worker/src packages/*/src
      - name: Testes
        run: uv run pytest
      - name: Modelos e migrações em sincronia (alembic check)
        working-directory: apps/api
        run: uv run alembic upgrade head && uv run alembic check

  frontend:
    name: Frontend (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - name: Dependências
        run: pnpm install ${{ hashFiles('pnpm-lock.yaml') != '' && '--frozen-lockfile' || '--no-frozen-lockfile' }}
      - name: Publicar pnpm-lock.yaml gerado (commitar na primeira vez)
        if: hashFiles('pnpm-lock.yaml') == ''
        uses: actions/upload-artifact@v4
        with: { name: pnpm-lock, path: pnpm-lock.yaml }
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
