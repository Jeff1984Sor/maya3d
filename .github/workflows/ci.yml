name: CI

on:
  pull_request:
  workflow_call: # reaproveitado pelo cd.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guards:
    name: Guardas (marca, shell, compose)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Marca não pode estar fixa no código
        run: python tools/check_brand.py
      - name: ShellCheck (ops)
        run: shellcheck -x -S warning ops/*.sh ops/lib/*.sh
      - name: Compose válido (staging e prod)
        run: |
          for stack in staging prod; do
            STACK_ENV_FILE=/dev/null REGISTRY=ghcr.io/ci IMAGE_TAG=ci \
            docker compose --env-file infra/compose/env/$stack.env \
              -f infra/compose/docker-compose.yml config --quiet
          done

  backend:
    name: Backend (ruff, mypy, pytest, migrações)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: print3d
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/print3d
      REDIS_URL: redis://localhost:6379/0
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: OpenSCAD (geração de paramétricos)
        # espelho do apt às vezes trava: tempo limite por tentativa e até 3 tentativas
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do
            if timeout 240 sudo apt-get update -qq -o Acquire::Retries=3               && timeout 240 sudo apt-get install -y -qq --no-install-recommends openscad; then
              exit 0
            fi
            echo "::warning::apt falhou (tentativa $i), tentando de novo"; sleep 15
          done
          exit 1
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - name: Dependências
        run: uv sync --all-packages --group dev --locked
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (formato)
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy apps/api/src apps/worker/src packages/core/src packages/ai/src packages/channels/src packages/notify/src packages/mesh/src packages/social/src
      - name: Testes
        run: uv run pytest
      - name: Falhas como anotações (legíveis pela API pública do GitHub)
        if: failure()
        run: |
          uv run pytest --lf -q --tb=line -p no:randomly 2>&1 | grep -E "^(FAILED|ERROR)|Error|assert"             | head -30 | while IFS= read -r line; do echo "::error::${line}"; done
      - name: Modelos e migrações em sincronia (alembic check)
        working-directory: apps/api
        run: uv run alembic upgrade head && uv run alembic check

  frontend:
    name: Frontend (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # sem lockfile ainda (1ª execução): cache do pnpm exigiria o arquivo
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}
      - name: Dependências
        run: pnpm install ${{ hashFiles('pnpm-lock.yaml') != '' && '--frozen-lockfile' || '--no-frozen-lockfile' }}
      - name: Publicar pnpm-lock.yaml gerado (commitar na primeira vez)
        if: hashFiles('pnpm-lock.yaml') == ''
        uses: actions/upload-artifact@v4
        with: { name: pnpm-lock, path: pnpm-lock.yaml }
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # App Expo: empacota o JavaScript para Android (pega import quebrado e dependência
      # incompatível sem precisar de celular). O build nativo é no EAS (mobile.yml).
      - name: App — empacotar (expo export)
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/app-export"
        env:
          EXPO_NO_TELEMETRY: "1"
