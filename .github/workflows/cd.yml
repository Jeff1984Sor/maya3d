name: CD

# main  -> CI -> build -> staging -> smoke -> (produção se AUTO_PROMOTE_PROD=true)
# tag v* -> CI -> build -> staging -> smoke -> produção (environment "production" pode exigir aprovação)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      promote:
        description: Promover para produção?
        type: boolean
        default: false

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false # nunca cancela um deploy no meio

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.image }}
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    strategy:
      matrix:
        include:
          - { image: backend, file: infra/docker/backend.Dockerfile, args: "" }
          - { image: storefront, file: infra/docker/web.Dockerfile, args: "APP=storefront" }
          - { image: admin, file: infra/docker/web.Dockerfile, args: "APP=admin" }
    steps:
      - uses: actions/checkout@v4
      - name: Registro em minúsculas (GHCR exige)
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT";
          else echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ env.REGISTRY }}/print3d-${{ matrix.image }}:${{ steps.tag.outputs.value }}
          build-args: |
            ${{ matrix.args }}
            RELEASE=${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  staging:
    name: Deploy staging + smoke
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/remote-deploy
        with:
          stack: staging
          image-tag: ${{ needs.build.outputs.tag }}
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-user: ${{ secrets.SSH_USER }}
          ssh-key: ${{ secrets.SSH_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

  production:
    name: Promover para produção
    needs: [build, staging]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.promote) ||
      (github.ref == 'refs/heads/main' && vars.AUTO_PROMOTE_PROD == 'true')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/remote-deploy
        with:
          stack: prod
          image-tag: ${{ needs.build.outputs.tag }}
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-user: ${{ secrets.SSH_USER }}
          ssh-key: ${{ secrets.SSH_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
