# Raiz do workspace uv. Não é um pacote: só orquestra membros, lint e tipos.
[project]
name = "print3d-workspace"
version = "0.0.0"
description = "Workspace Python da plataforma de impressão 3D"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "apps/api/src", "apps/worker/src",
    "packages/core/src", "packages/mesh/src", "packages/ai/src",
    "packages/channels/src", "packages/notify/src", "packages/social/src",
]
extend-exclude = ["apps/mobile", "**/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF", "PT"]
ignore = ["S101"]  # assert é ok nos testes

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]
"**/migrations/**" = ["E501"]
"tools/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = [
    "apps/api/src", "apps/worker/src",
    "packages/core/src", "packages/mesh/src", "packages/ai/src",
    "packages/channels/src", "packages/notify/src", "packages/social/src",
]
explicit_package_bases = true
exclude = ["/migrations/", "/tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests", "apps/worker/tests", "packages", "tools/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = ["integration: precisa de Postgres (RUN_DB_TESTS=1)"]
