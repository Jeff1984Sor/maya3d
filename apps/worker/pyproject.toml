[project]
name = "print3d-worker"
version = "0.1.0"
description = "Jobs assíncronos (arq): render, fatiamento, publicação, IA"
requires-python = ">=3.12"
dependencies = [
    "print3d-core",
    "print3d-mesh",
    "arq>=0.26",
    "redis>=5.2",
    "pydantic-settings>=2.7",
]

[tool.uv.sources]
print3d-core = { workspace = true }
print3d-mesh = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/print3d_worker"]
