[project]
name = "print3d-api"
version = "0.1.0"
description = "API FastAPI: rotas públicas, admin e webhooks"
requires-python = ">=3.12"
dependencies = [
    "print3d-core",
    "print3d-mesh",
    "print3d-ai",
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "arq>=0.26",
    "httpx>=0.28",  # consulta de CEP
    "email-validator>=2.2",
]

[tool.uv.sources]
print3d-core = { workspace = true }
print3d-mesh = { workspace = true }
print3d-ai = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/print3d_api"]
