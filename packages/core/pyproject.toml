[project]
name = "print3d-core"
version = "0.1.0"
description = "Domínio compartilhado: nichos, canais, segurança (Fernet), defaults de marca"
requires-python = ">=3.12"
dependencies = ["cryptography>=44.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/print3d_core"]
