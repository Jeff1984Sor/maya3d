[project]
name = "print3d-notify"
version = "0.1.0"
description = "NotifyProvider: WhatsApp (gateway MayaSec e Meta Cloud API)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10", "pydantic-settings>=2.7", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/print3d_notify"]
