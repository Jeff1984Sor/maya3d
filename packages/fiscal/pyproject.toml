[project]
name = "print3d-fiscal"
version = "0.1.0"
description = "Emissor próprio de NF-e (modelo 55): XML 4.00, assinatura e web services da SEFAZ"
requires-python = ">=3.12"
dependencies = ["cryptography>=44.0", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/print3d_fiscal"]
