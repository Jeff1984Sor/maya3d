[project]
name = "print3d-mesh"
version = "0.1.0"
description = "Pipeline 3D: análise de malha, paramétricos, render e fatiamento"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10"]
# Fase 1 adiciona: trimesh, manifold3d, build123d. Blender/slicer rodam em containers próprios.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/print3d_mesh"]
