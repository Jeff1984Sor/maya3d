[project]
name = "print3d-channels"
version = "0.1.0"
description = "Providers de canais de venda: mercadolivre, shopee, site"
requires-python = ">=3.12"
dependencies = ["print3d-core", "pydantic>=2.10"]

[tool.uv.sources]
print3d-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/print3d_channels"]
