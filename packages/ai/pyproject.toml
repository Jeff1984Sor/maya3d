[project]
name = "print3d-ai"
version = "0.1.0"
description = "Camada de IA: LLMProvider, EmbeddingProvider, config de modelos por tarefa"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10", "pydantic-settings>=2.7", "anthropic>=0.70"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/print3d_ai"]
